  notification:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-product-service, build-order-service, build-api-gateway]
    if: always()
    
    steps:
    - name: Build Status
      run: |
        echo "Build completed!"
        echo "Product Service: ${{ needs.build-product-service.result }}"
        echo "Order Service: ${{ needs.build-order-service.result }}"
        echo "API Gateway: ${{ needs.build-api-gateway.result }}"
        
        if [ "${{ needs.build-product-service.result }}" == "success" ] && \
           [ "${{ needs.build-order-service.result }}" == "success" ] && \
           [ "${{ needs.build-api-gateway.result }}" == "success" ]; then
          echo "✅ All services built successfully!"
          exit 0
        else
          echo "❌ Some services failed to build"
          exit 1
        fi
